    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            screens: {
              'xs': '475px',   /* enables xs: prefix used throughout the app */
            },
            colors: {
              brand: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
                800: '#1e40af',
                900: '#1e3a8a',
              }
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'blob': 'blob 7s infinite',
              'scan': 'scan 3s linear infinite',
              'shimmer': 'shimmer 3s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              scan: {
                '0%': { top: '-10%' },
                '100%': { top: '110%' }
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Outfit', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        overflow-x: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }

      .glass-card:hover {
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        transform: translateY(-2px);
        transition: all 0.3s ease;
      }

      .bg-grid-slate {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
      }
      /* Hero: zero out the grid pattern at source so nothing can restore it */
      header#home .bg-grid-slate {
        background-image: none !important;
        background: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        display: none !important;
      }

      .text-gradient {
        background: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .portrait-grayscale {
        filter: grayscale(100%);
        transition: filter 0.5s ease, transform 0.5s ease;
      }
      .group:hover .portrait-grayscale {
        filter: grayscale(0%);
        transform: scale(1.05);
      }

      .laser-line {
        position: absolute;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(to right, transparent, #3b82f6, transparent);
        box-shadow: 0 0 8px #3b82f6;
        z-index: 10;
        opacity: 0;
      }
      .group:hover .laser-line {
        opacity: 1;
        animation: scan 2s linear infinite;
      }

      /* ── Images: show face at top, never distort ──────── */
      img.portrait-grayscale {
        object-fit: cover !important;
        object-position: top center !important;
        width: 100% !important;
        height: 100% !important;
      }

      /* ── Committee photo containers: portrait aspect ratio */
      [id="organizing-committee"] .relative.overflow-hidden.rounded-2xl,
      [id="executive-council"] .relative.overflow-hidden.rounded-2xl {
        aspect-ratio: 3 / 4 !important;
        height: auto !important;
      }

      /* ══════════════════════════════════════════════════
         DARK MODE OVERRIDES
         ══════════════════════════════════════════════════ */

      html.dark body {
        background-color: #0f172a;
        color: #e2e8f0;
      }
      html.dark .glass-card {
        background: rgba(15, 23, 42, 0.9);
        border-color: rgba(71, 85, 105, 0.3);
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
      }
      html.dark .glass-card:hover {
        background: rgba(30, 41, 59, 0.95);
      }
      html.dark .bg-grid-slate {
        background-image: linear-gradient(to right, rgba(148,163,184,0.05) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(148,163,184,0.05) 1px, transparent 1px);
      }
      html.dark header#home .bg-grid-slate {
        background-image: none !important;
        background: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        display: none !important;
      }
      html.dark .text-gradient {
        background: linear-gradient(135deg, #60a5fa 0%, #22d3ee 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* ── Background colours ─────────────────────────── */
      html.dark [class*="bg-white"]       { background-color: #1e293b !important; }
      html.dark [class~="bg-slate-50"]    { background-color: #1e293b !important; }
      html.dark [class~="bg-slate-100"]   { background-color: #283548 !important; }
      html.dark [class~="bg-slate-200"]   { background-color: #334155 !important; }
      html.dark [class~="bg-blue-50"]     { background-color: #172554 !important; }
      html.dark [class~="bg-indigo-50"]   { background-color: #1e1b4b !important; }
      html.dark [class~="bg-purple-50"]   { background-color: #2e1065 !important; }
      html.dark [class~="bg-green-50"]    { background-color: #052e16 !important; }
      html.dark [class~="bg-orange-50"]   { background-color: #431407 !important; }
      html.dark [class~="bg-red-50"]      { background-color: #450a0a !important; }

      /* ── Text colours ───────────────────────────────── */
      html.dark [class~="text-slate-900"] { color: #f1f5f9 !important; }
      html.dark [class~="text-slate-800"] { color: #e2e8f0 !important; }
      html.dark [class~="text-slate-700"] { color: #cbd5e1 !important; }
      html.dark [class~="text-slate-600"] { color: #94a3b8 !important; }
      /* slate-500 bumped up — was same value as light-mode (#64748b), too dark on dark bg */
      html.dark [class~="text-slate-500"] { color: #94a3b8 !important; }

      /* ── Borders ────────────────────────────────────── */
      html.dark [class~="border-slate-100"] { border-color: #334155 !important; }
      html.dark [class~="border-slate-200"] { border-color: #475569 !important; }
      html.dark [class~="border-blue-100"]  { border-color: #1e3a8a !important; }

      /* ── Countdown boxes (bg-white/80 backdrop-blur-md) */
      html.dark [class*="bg-white"][class*="backdrop-blur-md"] {
        background-color: rgba(15, 23, 42, 0.92) !important;
        border-color: rgba(71, 85, 105, 0.35) !important;
      }

      /* ── Sub-menu dropdowns (bg-white/95 backdrop-blur-xl) */
      html.dark [class*="bg-white"][class*="backdrop-blur-xl"] {
        background-color: rgba(10, 16, 32, 0.98) !important;
        border-color: rgba(71, 85, 105, 0.55) !important;
      }
      /* Icon pill inside sub-menu items */
      html.dark [class*="backdrop-blur-xl"] [class~="bg-slate-100"] {
        background-color: rgba(51, 65, 85, 0.9) !important;
      }

      /* ── ★ HERO SECTION — restore tricolor gradient ─── */
      /* 1. Very dark canvas so gradient sits correctly */
      html.dark header#home {
        background-color: #060d1a !important;
      }
      /* 2. HN wrapper (bg-slate-50) → transparent so gradient is visible */
      html.dark header#home [class~="bg-slate-50"] {
        background-color: transparent !important;
      }
      /* 3. bg-white/90 middle blur fill → dark-transparent (neutral blur between orange & green) */
      html.dark header#home [class*="bg-white/90"] {
        background-color: rgba(6, 13, 26, 0.45) !important;
      }
      /* 4. bg-white/30 final overlay → near-transparent */
      html.dark header#home [class*="bg-white/30"] {
        background-color: rgba(6, 13, 26, 0.08) !important;
      }
      /* 5. Plain bg-white inline badges/pills in hero */
      html.dark header#home [class~="bg-white"] {
        background-color: rgba(15, 23, 42, 0.88) !important;
      }
      /* 6. Logo card & glassmorphism elements */
      html.dark header#home [class*="bg-white"][class*="backdrop-blur"] {
        background-color: rgba(15, 23, 42, 0.82) !important;
        border-color: rgba(71, 85, 105, 0.4) !important;
      }

      /* ── NAV ─────────────────────────────────────────── */
      /* Scrolled pill */
      html.dark nav .glass-card {
        background: rgba(10, 16, 32, 0.96) !important;
        border-color: rgba(71, 85, 105, 0.3) !important;
      }
      /* Unscrolled pill (bg-white/30 backdrop-blur-sm) → semi-transparent, not solid */
      html.dark nav [class*="bg-white/30"][class*="backdrop-blur-sm"] {
        background-color: rgba(6, 13, 26, 0.55) !important;
        border-color: rgba(148, 163, 184, 0.12) !important;
      }
      /* Nav link text */

      html.dark nav button:not(#theme-toggle) {
        color: #cbd5e1 !important;
      }
      html.dark nav a:hover { color: #93c5fd !important; }
      html.dark nav a[class*="text-blue-6"] { color: #93c5fd !important; }
      /* Active nav link highlight */

      }

      }
      /* Mobile Download Brochure full-width */
      html.dark a[class~="border-slate-200"][class~="font-bold"] {
        background-color: rgba(30, 41, 59, 0.85) !important;
        color: #e2e8f0 !important;
        border-color: #475569 !important;

        border-color: #475569 !important;

      /* ── Theme toggle ───────────────────────────────── */
      #theme-toggle {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid rgba(148, 163, 184, 0.35);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
        outline: none;
        /* fallback: fixed if JS can't place it in nav */
        position: fixed;
        top: 20px;
        right: 16px;
        z-index: 99999;
      }
      #theme-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 2px 10px rgba(99, 102, 241, 0.25);
      }
      html.dark #theme-toggle {
        background: rgba(15, 23, 42, 0.92) !important;
        border-color: rgba(71, 85, 105, 0.5) !important;
        box-shadow: 0 1px 4px rgba(0,0,0,0.5) !important;
        color: #e2e8f0 !important;
      }
      /* In-nav: switch from fixed to inline */
      #theme-toggle.in-nav {
        position: relative;
        top: auto;
        right: auto;
        z-index: auto;
        margin: 0;
      }
      #theme-toggle .t-icon { line-height: 1; pointer-events: none; }
      /* Tooltip */
      #theme-toggle::after {
        content: attr(data-mode);
        position: absolute;
        top: calc(100% + 6px);
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #6366f1;
        background: white;
        border-radius: 4px;
        padding: 1px 5px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        white-space: nowrap;
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        z-index: 1;
      }
      html.dark #theme-toggle::after { background: #1e293b; color: #a5b4fc; }
      #theme-toggle:hover::after { opacity: 1; }

      /* ══════════════════════════════════════════════════
         RESPONSIVE OVERRIDES
         ══════════════════════════════════════════════════ */

      /* ── Base: smooth font rendering ──────────────────── */
      * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

      /* ── Mobile first: < 475px (< xs) ─────────────────── */
      @media (max-width: 474px) {

        nav > div > div {

        }

        /* Section vertical spacing — py-24 (96px) → 56px */
        [class~="py-24"] {
          padding-top: 3.5rem !important;
          padding-bottom: 3.5rem !important;
        }
        [class~="py-20"] {
          padding-top: 3rem !important;
          padding-bottom: 3rem !important;
        }
        [class~="py-12"] {
          padding-top: 2rem !important;
          padding-bottom: 2rem !important;
        }

        /* Hero heading: keep readable */
        header#home h1 {
          font-size: clamp(2rem, 10vw, 2.75rem) !important;
          line-height: 1.1 !important;
        }

        /* Countdown: tighten gap so 4 boxes fit */
        header#home [class*="gap-2"][class*="justify-center"],
        header#home [class*="gap-3"][class*="justify-center"] {
          gap: 0.35rem !important;
        }

        /* Gallery: single column on very small phones */
        [class*="grid-cols-2"]:not([class*="md:"]):not([class*="lg:"]) {
          grid-template-columns: 1fr !important;
        }

        /* Partner logos: 2 cols on tiny screens */
        [class*="grid-cols-3"]:not([class*="md:"]):not([class*="lg:"]) {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }

        /* Speaker / committee card images: scale down */
        .relative.w-28.h-28 { width: 5rem !important; height: 5rem !important; }
        .relative.w-20.h-20 { width: 4rem !important; height: 4rem !important; }

        /* Footer social icons: wrap nicely */
        footer .flex.gap-4.flex-wrap { justify-content: center; }

      /* ── Small phones + large phones: < 640px (< sm) ──── */
      @media (max-width: 639px) {
        /* Reduce section padding across all sections */
        [class~="py-24"] {
          padding-top: 4rem !important;
          padding-bottom: 4rem !important;
        }
        [class~="py-20"] {
          padding-top: 3.5rem !important;
          padding-bottom: 3.5rem !important;
        }

        /* Section inner horizontal padding */
        [class~="px-4"] { padding-left: 1rem !important; padding-right: 1rem !important; }

        /* Hero: reduce top padding so content isn't buried */
        header#home {
          padding-top: 6rem !important;
          padding-bottom: 3rem !important;
        }

        /* CTA buttons: full width on mobile */
        header#home [class*="flex-wrap"][class*="gap-4"] > a,
        header#home [class*="flex-wrap"][class*="gap-4"] > div {
          min-width: 0;
          flex: 1 1 auto;
          justify-content: center;
        }

        /* Stats row: wrap to 2 per row on mobile */
        header#home [class*="flex-wrap"][class*="gap-4"] {
          gap: 0.5rem !important;
        }

        /* Cards: full-width single column on mobile before md: kicks in */
        [class~="grid"][class~="md:grid-cols-2"]:not([class*="lg:grid-cols"]) {
          grid-template-columns: 1fr;
        }
        [class~="grid"][class~="md:grid-cols-3"] {
          grid-template-columns: 1fr;
        }

        /* Footer: single column */
        footer [class~="grid"] {
          grid-template-columns: 1fr !important;
          gap: 2rem !important;
        }

        /* Reduce mb-16/mb-20 in footer */
        footer [class~="mb-16"] { margin-bottom: 2rem !important; }

        /* Section titles */
        [class~="text-4xl"] { font-size: 1.75rem !important; }
        [class~="text-3xl"] { font-size: 1.5rem !important; }
      }

      /* ── Tablet: 640px – 767px (sm) ───────────────────── */
      @media (min-width: 640px) and (max-width: 767px) {
        [class~="py-24"] {
          padding-top: 5rem !important;
          padding-bottom: 5rem !important;
        }
        /* 2-column grid for cards that only go 2-col at md */
        [class~="grid"][class~="md:grid-cols-2"] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      /* ── Tablet landscape: 768px – 1023px (md) ─────────── */
      @media (min-width: 768px) and (max-width: 1023px) {
        /* Speaker grid: 2 columns at tablet, 3 at desktop */
        [class~="grid"][class~="md:grid-cols-2"][class~="lg:grid-cols-3"] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        /* Reduce extra-large section padding slightly */
        [class~="py-24"] {
          padding-top: 5.5rem !important;
          padding-bottom: 5.5rem !important;
        }
      }

      /* ── Desktop: 1024px – 1279px (lg) ────────────────── */
      @media (min-width: 1024px) and (max-width: 1279px) {
        /* Ensure inner content doesn't hug edges */
        [class~="max-w-7xl"] { padding-left: 2rem; padding-right: 2rem; }
      }

      /* ── Wide: 1280px – 1535px (xl) ───────────────────── */
      @media (min-width: 1280px) {
        /* Slightly increase max container width benefit from more space */
        [class~="max-w-7xl"] { max-width: 82rem; }
      }

      /* ── Ultra-wide: ≥ 1536px (2xl) ───────────────────── */
      @media (min-width: 1536px) {
        [class~="max-w-7xl"] { max-width: 90rem; }
        /* Hero heading can go larger */
        header#home h1 { font-size: clamp(5rem, 7vw, 9rem) !important; }
        /* Section padding has room to breathe */
        [class~="py-24"] {
          padding-top: 8rem !important;
          padding-bottom: 8rem !important;
        }
      }

      /* ══════════════════════════════════════════════════
         INDIAN FLAG TRICOLOR — always prominent
         ══════════════════════════════════════════════════
         The HN component renders three animated gradient bands
         (saffron → white → green) rotated -45° across the hero.

         ISSUES FIXED:
         A. Grid/checkerboard: making bg-slate-50 transparent exposed
            the bg-grid-slate layer underneath → hide it entirely.
         B. Dark mode washed out: gradient needs saturate+brightness
            boost against a dark canvas.
         C. Flickering: animated blur divs need GPU compositor layers
            (translateZ + will-change) so opacity/scale changes don't
            trigger browser rasterisation on every frame.
      */

      /* ── A. KILL BOTH GRID LAYERS IN THE HERO ─────────── */
      /*
       * Outer grid (.bg-grid-slate): also zeroed at source above.
       * Inner grid (HN's 2nd child): inline Tailwind arbitrary
       *   bg-[linear-gradient(...)] with radial mask — rendered
       *   ABOVE the tricolor bands (later DOM order = higher z).
       * Attack with every property so no cascade path can restore it.
       */
      header#home .bg-slate-50 > div:nth-child(2) {
        background-image: none !important;
        background: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        display: none !important;
        -webkit-mask-image: none !important;
        mask-image: none !important;
      }

      /* ── B. BASE (all modes, all sizes) ───────────────── */

      /* Remove competing grey base from HN wrapper */
      header#home .bg-slate-50 {
        background-color: transparent !important;
      }

      /* GPU-promote the animated gradient divs — prevents flicker */
      header#home .bg-slate-50 > div:first-child,
      header#home .bg-slate-50 > div:first-child > div {
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        will-change: transform, opacity;
        isolation: isolate;
      }

      /* Lift tricolor opacity: 0.60 → 0.82 */
      header#home .bg-slate-50 > div:first-child {
        opacity: 0.82 !important;
      }

      /* Thin white-wash to let stripes breathe */
      header#home .bg-slate-50 > div:last-child {

        backdrop-filter: none !important;
