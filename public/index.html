  <!-- Dark mode: apply before first paint to avoid flash -->
  <script>
    (function () {
      var STORAGE_KEY = 'bls-theme';
      var html = document.documentElement;

      function getEffective(pref) {
        if (pref === 'dark') return 'dark';
        if (pref === 'light') return 'light';
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function applyPref(pref) {
        var effective = getEffective(pref);
        html.classList.toggle('dark', effective === 'dark');
        var btn = document.getElementById('theme-toggle');
        if (btn) {
          btn.querySelector('.t-icon').textContent = effective === 'dark' ? '☀️' : '🌙';
          btn.setAttribute('data-mode', pref === 'system' ? 'auto' : pref);
          btn.title = pref === 'system'
            ? 'Auto (system). Click for dark'
            : pref === 'dark'
            ? 'Dark mode. Click for light'
            : 'Light mode. Click for auto';
        }
      }

      // Apply immediately (prevents flash)
      var saved = localStorage.getItem(STORAGE_KEY) || 'system';
      applyPref(saved);

      // React to OS changes when on 'system'
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if ((localStorage.getItem(STORAGE_KEY) || 'system') === 'system') applyPref('system');
      });

      // Inject button after DOM is ready
      document.addEventListener('DOMContentLoaded', function () {
        var btn = document.createElement('button');
        btn.id = 'theme-toggle';
        btn.setAttribute('aria-label', 'Toggle colour theme');
        var icon = document.createElement('span');
        icon.className = 't-icon';
        btn.appendChild(icon);

        // Try to place the toggle inside the nav's desktop controls area
        // (the div that directly wraps the /register link — same row as Brochure)
        function tryPlaceInNav() {
          var regLink = document.querySelector('nav a[href="/register"]');
          if (!regLink) return false;
          var slot = regLink.closest('div');
          if (!slot) return false;
          btn.classList.add('in-nav');
          slot.insertBefore(btn, slot.firstChild);
          return true;
        }

        if (!tryPlaceInNav()) {
          // Retry once after a short delay (React may still be mounting)
          setTimeout(function () {
            if (!tryPlaceInNav()) {
              document.body.appendChild(btn);
            }
          }, 500);
        }

        applyPref(localStorage.getItem(STORAGE_KEY) || 'system');

        btn.addEventListener('click', function () {
          // Cycle: system → dark → light → system
          var cur = localStorage.getItem(STORAGE_KEY) || 'system';
          var next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
          localStorage.setItem(STORAGE_KEY, next);
          applyPref(next);
        });
      });
    })();
  </script>
